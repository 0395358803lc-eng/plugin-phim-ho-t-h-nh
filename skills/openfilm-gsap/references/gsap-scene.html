<!doctype html>
<html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141a32}
#word{position:absolute;top:40%;left:15%;color:#fff;font:700 80px sans-serif;will-change:transform,opacity}
</style></head><body><div id="word">Xin chào!</div>
<!-- Example: vendor path must be resolved to an already validated and approved GSAP library. -->
<script src="../vendor/gsap/gsap.min.js"></script>
<script>
const el=document.querySelector('#word');
const tl=gsap.timeline({paused:true})
  .fromTo(el,{x:-400,opacity:0},{x:0,opacity:1,duration:1.5,ease:'power3.out'},0)
  .to(el,{scale:1.08,duration:.5,ease:'sine.inOut'},1.5)
  .to(el,{scale:1,duration:.5,ease:'sine.inOut'},2);
window.film={duration:3,frame(t){tl.pause().seek(Math.min(3,Math.max(0,t)),true);}};
</script></body></html>
